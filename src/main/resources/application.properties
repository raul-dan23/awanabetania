# Configuratia de baza = configuratia de productie ("sigur implicit").
# Secretele vin din variabile de mediu; lista completa, cu explicatii, e in .env.example.
# Pe server, /var/www/html/application.properties (netrackat) suprascrie orice valoare de aici.

spring.application.name=AwanaBetania
server.address=0.0.0.0
server.port=8080

# Dezvoltare locala: valorile pot sta intr-un fisier .env in radacina proiectului
# (cp .env.example .env). Fisierul e optional si ignorat de git.
spring.config.import=optional:file:.env[.properties]

# Baza de date
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/awana_club_manager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema bazei de date: o modifica DOAR Flyway, prin fisierele din db/migration.
# Hibernate doar verifica la pornire ca tabelele corespund entitatilor si refuza sa
# porneasca altfel. Nu reveni la ddl-auto=update: modifica schema de productie fara
# urma si nu poate sterge sau schimba coloane.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Baza de productie exista dinainte de Flyway: la prima pornire, Flyway inregistreaza
# schema existenta ca versiunea 1 (V1__baseline.sql nu ruleaza acolo) si aplica doar
# migrarile mai noi. Pe o baza goala ruleaza toate migrarile, inclusiv V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Actuator: doar /actuator/health (UP/DOWN, fara detalii) si /actuator/info (versiunea
# si commit-ul care ruleaza). deploy.sh le foloseste ca sa confirme ca versiunea noua
# chiar a pornit.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.info.git.mode=simple

# In spatele proxy-ului HTTPS: aplicatia accepta X-Forwarded-Proto/For doar de la un
# proxy local, ca sa stie ca cererea a venit pe HTTPS si care e IP-ul real al clientului.
server.forward-headers-strategy=native

# Token pentru securizarea endpoint-urilor NFC
nfc.token=${NFC_TOKEN}

# Cheie criptare AES parole
aes.secret.key=${AES_SECRET_KEY}

# PIN acces Control Center admin
admin.pin=${ADMIN_PIN}

# Secret pentru semnarea token-urilor JWT (minim 32 caractere)
jwt.secret=${JWT_SECRET}
jwt.validity-hours=12

# Coduri de inregistrare lideri (separate prin virgula) — erau hardcodate in sursa
auth.registration-codes=${AUTH_REGISTRATION_CODES}

# Originile din care browserul poate apela API-ul (inlocuieste @CrossOrigin origins="*")
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://awana.betania-tm.ro}
