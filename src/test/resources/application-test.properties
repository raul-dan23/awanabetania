# In-memory database so tests never touch the real MySQL data.
# H2 cannot run the MySQL migrations, so here Hibernate builds the schema from the
# entities and Flyway is off. DatabaseMigrationTest checks the real migrations on MySQL.
spring.datasource.url=jdbc:h2:mem:awanatest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256
jwt.validity-hours=1
auth.registration-codes=TESTCODE
cors.allowed-origins=http://localhost:5173
aes.secret.key=1234567890123456
admin.pin=0000
nfc.token=test-nfc-token
